<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">LLM Training Cookbook</title>
  <desc id="d">An open cookbook with a neural network rising from its pages</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- soft glow behind the top node -->
  <circle cx="256" cy="100" r="78" fill="url(#glow)"/>

  <!-- network edges -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="256" y1="100" x2="176" y2="152"/>
    <line x1="256" y1="100" x2="336" y2="152"/>
    <line x1="256" y1="100" x2="256" y2="172"/>
    <line x1="176" y1="152" x2="256" y2="172"/>
    <line x1="336" y1="152" x2="256" y2="172"/>
    <line x1="176" y1="152" x2="122" y2="196"/>
    <line x1="336" y1="152" x2="390" y2="196"/>
    <line x1="256" y1="172" x2="256" y2="244"/>
  </g>

  <!-- network nodes -->
  <g fill="#5eead4">
    <circle cx="176" cy="152" r="13"/>
    <circle cx="336" cy="152" r="13"/>
    <circle cx="256" cy="172" r="13"/>
    <circle cx="122" cy="196" r="10"/>
    <circle cx="390" cy="196" r="10"/>
  </g>
  <circle cx="256" cy="100" r="22" fill="#fbbf24"/>
  <circle cx="256" cy="100" r="34" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="4"/>

  <!-- book: page thickness -->
  <g fill="#a5b4fc">
    <path d="M256 406 C216 380 160 372 104 380 L104 366 C160 358 216 366 256 392 Z"/>
    <path d="M256 406 C296 380 352 372 408 380 L408 366 C352 358 296 366 256 392 Z"/>
  </g>

  <!-- book: pages -->
  <g fill="#f8fafc">
    <path d="M256 392 C216 366 160 358 104 366 L104 238 C160 230 216 238 256 264 Z"/>
    <path d="M256 392 C296 366 352 358 408 366 L408 238 C352 230 296 238 256 264 Z"/>
  </g>

  <!-- spine -->
  <line x1="256" y1="264" x2="256" y2="392" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>

  <!-- text/code lines on the pages -->
  <g stroke="#4f46e5" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M134 272 Q182 270 226 290"/>
    <path d="M134 298 Q182 296 226 316"/>
    <path d="M134 324 Q170 322 200 336"/>
    <path d="M378 272 Q330 270 286 290"/>
